name: package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 直接打包仓库内已提交的产物：dist 是手工维护的发布构建，
      # js/ 尚未与之完全同步，这里不做 npm run build。
      - name: Pack Eagle plugin
        run: |
          (cd Plugin && zip -qr "../Edge-Media-Download-NEW-v${{ steps.version.outputs.value }}.eagleplugin" .)

      - name: Pack Edge extension
        run: |
          (cd edge-extension && zip -qr "../Edge-Media-Download-NEW-extension-v${{ steps.version.outputs.value }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            Edge-Media-Download-NEW-v*.eagleplugin
            Edge-Media-Download-NEW-extension-v*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Edge-Media-Download-NEW-v*.eagleplugin
            Edge-Media-Download-NEW-extension-v*.zip
